  if(img){
    if(t){
      img.outerHTML=`<img id="flag-${select.id}" class="ko-country-flag" src="${flag(t.flag)}" alt="${esc(select.value)} vlag">`;

      img.outerHTML=`<span id="flag-${select.id}" class="ko-country-flag placeholder"></span>`;
    }

  if(label){

function replaceRowsByKey(existing, incoming, keyFn){
  const incomingKeys = new Set((incoming||[]).map(keyFn));

    ...(incoming||[])
  ];
}

// v59: Algemene opslag voor oude én nieuwe accounts.
// Niet verwijderen + invoegen, maar upsert: bestaande regels worden bijgewerkt,
// nieuwe regels worden aangemaakt. Dit voorkomt problemen bij oude lege records.
async function normalizeForCompare(v){
  if(v===null || v===undefined) return '';
  return String(v).trim();
}
function rowMatchesExpected(table, expected, actual, keyColumn){
  if(!actual) return false;
  if(table==='predictions'){
    return normalizeForCompare(actual.home_goals)===normalizeForCompare(expected.home_goals) &&
           normalizeForCompare(actual.away_goals)===normalizeForCompare(expected.away_goals);
  }
  if(table==='bonus_answers' || table==='official_bonus_answers'){
    return normalizeForCompare(actual.answer)===normalizeForCompare(expected.answer);
  }
  if(table==='official_results'){
    return normalizeForCompare(actual.home_goals)===normalizeForCompare(expected.home_goals) &&
           normalizeForCompare(actual.away_goals)===normalizeForCompare(expected.away_goals);
  }
  return true;
}
async function replaceParticipantRowsInSupabase(table, pid, keyColumn, rows){
  if(!rows || !rows.length) return [];
  const cleanRows = rows.map(row => ({...row, participant_id: pid}));
  const conflictTarget = keyColumn === 'match_id'
    ? 'participant_id,match_id'
    : 'participant_id,question_id';

  // Stap 1: normale upsert. Dit werkt voor nieuwe accounts én hoort bestaande regels bij te werken.
  const saved = await db
    .from(table)
    .upsert(cleanRows, { onConflict: conflictTarget })
    .select();

  if(saved.error){
    throw new Error(`${table}: opslaan/updaten is mislukt. ${saved.error.message}`);
  }

  const keys = [...new Set(cleanRows.map(r => String(r[keyColumn])))] ;

  async function fetchVerifyRows(){
    const verify = await db
      .from(table)
      .select('*')
      .eq('participant_id', pid)
      .in(keyColumn, keys);
    if(verify.error){
      throw new Error(`${table}: controle na opslaan mislukt. ${verify.error.message}`);
    }
    return verify.data || [];
  }

  // Stap 2: controleer niet alleen aantallen, maar ook of de opgeslagen waarden exact overeenkomen.
  let verifyRows = await fetchVerifyRows();
  let verifyMap = {};
  verifyRows.forEach(r=>{ verifyMap[String(r[keyColumn])] = r; });

  const missingOrWrong = cleanRows.filter(row=>{
    const key=String(row[keyColumn]);
    return !rowMatchesExpected(table, row, verifyMap[key], keyColumn);
  });

  // Stap 3: oude accounts kunnen al een lege rij hebben. Als upsert die niet goed heeft bijgewerkt,
  // forceer dan per regel een update op participant_id + keyColumn.
  for(const row of missingOrWrong){
    const key=String(row[keyColumn]);
    const updatePayload={...row};
    delete updatePayload.participant_id;
    delete updatePayload[keyColumn];

    const upd = await db
      .from(table)
      .update(updatePayload)
      .eq('participant_id', pid)
      .eq(keyColumn, key)
      .select();

    if(upd.error){
      throw new Error(`${table}: bestaande regel ${key} kon niet worden bijgewerkt. Controleer UPDATE-policy. ${upd.error.message}`);
    }

    // Als er nog geen rij bestond, maak hem alsnog aan.
    if(!upd.data || !upd.data.length){
      const ins = await db.from(table).insert(row).select();
      if(ins.error){
        throw new Error(`${table}: nieuwe regel ${key} kon niet worden aangemaakt. Controleer INSERT-policy. ${ins.error.message}`);
      }
    }
  }

  verifyRows = await fetchVerifyRows();
  verifyMap = {};
  verifyRows.forEach(r=>{ verifyMap[String(r[keyColumn])] = r; });

  const stillWrong = cleanRows.filter(row=>{
    const key=String(row[keyColumn]);
    return !rowMatchesExpected(table, row, verifyMap[key], keyColumn);
  });
  if(stillWrong.length){
    throw new Error(`${table}: ${stillWrong.length} regel(s) staan na opslaan nog niet goed in Supabase. Meestal ontbreekt UPDATE-policy of SELECT-policy.`);
  }

  return verifyRows.filter(r=>keys.includes(String(r[keyColumn])));
}

function deletedParticipantsGlobal(){
  const raw = state.settings.deleted_participants || [];
  if(Array.isArray(raw)) return raw;
  try{return JSON.parse(raw || "[]");}catch(e){return [];}
}
function deletedParticipantsAll(){
  const local = JSON.parse(localStorage.getItem('wk_deleted_participants') || '[]');
  return [...new Set([...local, ...deletedParticipantsGlobal()])];
}
async function saveDeletedParticipantsGlobal(ids){
  const clean=[...new Set((ids||[]).filter(Boolean))];
  state.settings.deleted_participants = clean;
  localStorage.setItem('wk_deleted_participants', JSON.stringify(clean));
  return await db.from("app_settings").upsert({key:"deleted_participants", value:JSON.stringify(clean)},{onConflict:"key"});
}
async function syncLocalDeletedParticipantsToGlobal(){
  const local = JSON.parse(localStorage.getItem('wk_deleted_participants') || '[]');
  if(!local.length) return;
  const merged = deletedParticipantsAll();
  const global = deletedParticipantsGlobal();
  if(merged.length !== global.length || merged.some(id=>!global.includes(id))){
    await saveDeletedParticipantsGlobal(merged);
  }
}
function participantIsDeleted(p){
  return !p || p.status==="deleted" || p.password==="deleted" || String(p.email||"").startsWith("deleted_") || deletedParticipantsAll().includes(p.id);
}

async function loadAll(){
  try{
    const [p, pr, r, b, ob, msg, set] = await Promise.all([
      db.from("participants").select("*").order("created_at"),
      db.from("predictions").select("*"),
      db.from("official_results").select("*"),
      db.from("bonus_answers").select("*"),
      db.from("official_bonus_answers").select("*"),
      db.from("messages").select("*").order("created_at", {ascending:false}).limit(80),
      db.from("app_settings").select("*")
    ]);
    const loadError = [p, pr, r, b, ob, msg, set].find(x=>x && x.error)?.error;
    if(loadError) throw loadError;

    // Eerst instellingen laden, vooral de globale verwijderlijst.
    // Anders kunnen nieuwe gebruikers oude verwijderde deelnemers nog zien.
    (set.data||[]).forEach(s=>{
      if(s.key==="deleted_participants"){
        try{state.settings[s.key]=Array.isArray(s.value)?s.value:JSON.parse(s.value || "[]");}catch(e){state.settings[s.key]=[];}
      }else{
        state.settings[s.key]=typeof s.value==="boolean"?s.value:String(s.value)==="true";
      }
    });
    await syncLocalDeletedParticipantsToGlobal();

    // Daarna pas deelnemers en alle gekoppelde data filteren.

function predictionFilled(row){

         row.away_goals!==null && row.away_goals!==undefined && row.away_goals!=='' &&

function newerRow(a,b){
  const da = new Date(a?.updated_at || a?.created_at || 0).getTime() || 0;
  const db = new Date(b?.updated_at || b?.created_at || 0).getTime() || 0;

}
function betterPredictionRow(existing,row){
  if(!existing) return row;
  const eFilled=predictionFilled(existing);
  const rFilled=predictionFilled(row);
  if(rFilled && !eFilled) return row;
  if(!rFilled && eFilled) return existing;
  return newerRow(existing,row);
}
function answerFilled(row){

function betterAnswerRow(existing,row){

  const eFilled=answerFilled(existing);

  if(rFilled && !eFilled) return row;
  if(!rFilled && eFilled) return existing;
  return newerRow(existing,row);
}

function outcome(h,a){if(h>a)return "H"; if(h<a)return "A"; return "D";}
function scorePrediction(pred,res){
  if(!pred || !res || pred.home_goals==null || pred.away_goals==null || res.home_goals==null || res.away_goals==null) return 0;
  const ph=Number(pred.home_goals), pa=Number(pred.away_goals), rh=Number(res.home_goals), ra=Number(res.away_goals);
  if([ph,pa,rh,ra].some(n=>Number.isNaN(n))) return 0;
  if(ph===rh && pa===ra) return 6;
  if(outcome(ph,pa)===outcome(rh,ra)) return 3;
  return 0;
}

}

  }, 0);
}

function resultWinnerLoserLabels(picks, score, matchId){
  const labels={};

  const hasScore = hg!==undefined && ag!==undefined && hg!==null && ag!==null && hg!=='' && ag!=='' && !Number.isNaN(Number(hg)) && !Number.isNaN(Number(ag));

  if(!hasScore){
    labels[home] = `wedstrijd ${matchId}: boven/thuis`;
    labels[away] = `wedstrijd ${matchId}: onder/uit`;
    return labels;
  }

  if(Number(hg) > Number(ag)){

function participantPredictedTeamForSlot(slot, pid){
  if(!slot || !pid) return [];

  // Belangrijk: de Laatste 32 moet gebaseerd zijn op de poulestand van déze deelnemer.
  // Dus bij "1e Poule A" tonen we het land dat deze deelnemer zelf als 1e heeft voorspeld.
  if(slot.type==='place'){
    const rows=getPredictionGroupStandings(`Groep ${slot.group}`, pid);
    const team=rows[Number(slot.place)-1];
    return team?.name ? [team.name] : [];
  }

  // Voor beste nummers 3 gebruiken we ook de voorspelde poulestanden van deze deelnemer.
  if(slot.type==='third'){
    const allowedCodes=slot.allowed.split('/');
    const predictedThirds=[...new Set(matches.map(m=>m.group))].map(group=>{
      const rows=getPredictionGroupStandings(group, pid);
      const team=rows[2];
      return team ? {...team, groupCode:groupCode(group)} : null;
    }).filter(Boolean).sort((a,b)=>b.points-a.points||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name));

    const qualified=predictedThirds.slice(0,8).filter(t=>allowedCodes.includes(t.groupCode)).map(t=>t.name);
    if(qualified.length) return [...new Set(qualified)];

    // Fallback zolang iemand de poule nog niet compleet heeft ingevuld.
    const fallback=allowedCodes.map(code=>{
      const rows=getPredictionGroupStandings(`Groep ${code}`, pid);
      return rows[2]?.name;
    }).filter(Boolean);
    return [...new Set(fallback)];
  }

  return [];
}

  if(source && typeof source==='object') return participantPredictedTeamForSlot(source, pid);

  // Dus bij "Winnaar wedstrijd 73" komen alleen de thuis/uit landen van wedstrijd 73 terug.

function participantScore(pid){
  const res=resultMap();
  const preds=predictionMap(pid);

  // Vanaf v19: alle punten tellen direct zodra beheer iets officieel invult.
  // Poulewedstrijden tellen per wedstrijd zodra de officiële uitslag is ingevuld.
  const poulePoints = scoreRange(preds,res,matches.map(m=>m.id), pid);

  const laatste32Ids = knockoutFirstRound.map(f=>f.id);
  const achtsteIds = [89,90,91,92,93,94,95,96];
  const kwartIds = [97,98,99,100];
  const halveIds = [101,102];
  const finaleIds = [104];

  // Knock-outpunten tellen direct per wedstrijd:
  // landen/schema-punten zodra beheer de landen invult,
  // uitslagpunten zodra beheer de uitslag invult.
  const laatste32Points = scoreKnockoutRound(pid, laatste32Ids, 'laatste32');
  const achtstePoints = scoreKnockoutRound(pid, achtsteIds, 'achtste');
  const kwartPoints = scoreKnockoutRound(pid, kwartIds, 'kwart');
  const halvePoints = scoreKnockoutRound(pid, halveIds, 'halve');
  const finalePoints = scoreKnockoutRound(pid, finaleIds, 'finale');
  const bonusPoints = scoreBonus(pid);
  const total = poulePoints + laatste32Points + achtstePoints + kwartPoints + halvePoints + finalePoints + bonusPoints;
  return {poulePoints, laatste32Points, achtstePoints, kwartPoints, halvePoints, finalePoints, bonusPoints, total, matchPoints:poulePoints};
}

function rankMovementHTML(participantId, currentIndex){
  let oldOrder=[];
  try{oldOrder=JSON.parse(localStorage.getItem("wk_last_standings_order") || "[]");}catch(e){oldOrder=[];}
  if(!oldOrder.length) return `<span class="rank-new">nieuw</span>`;
  const oldIndex=oldOrder.indexOf(participantId);
  if(oldIndex<0) return `<span class="rank-new">nieuw</span>`;

  const diff=oldIndex-currentIndex;
  if(diff===0) return `<span class="rank-same" title="Gelijk gebleven"></span>`;

  const count=Math.min(Math.abs(diff), 3);

  function chevron(direction){
    return `<span class="rank-chevron ${direction}">
      <svg viewBox="0 0 100 60" aria-hidden="true">
        <path d="M10 10 L50 45 L90 10 L90 25 L50 60 L10 25 Z" fill="currentColor"
          transform="${direction==='up' ? 'translate(0,60) scale(1,-1)' : ''}"></path>
      </svg>
    </span>`;
  }

  if(diff>0){
    return `<span class="rank-move" title="${diff} plek${diff===1?'':'ken'} gestegen">${Array(count).fill(chevron('up')).join('')}</span>`;
  }

  const down=Math.abs(diff);
  return `<span class="rank-move" title="${down} plek${down===1?'':'ken'} gezakt">${Array(count).fill(chevron('down')).join('')}</span>`;
}

function groupTeams(group){
  const map={};
  matches.filter(m=>m.group===group).forEach(m=>{
    [m.home,m.away].forEach(t=>{if(!map[t.name]) map[t.name]={name:t.name, flag:t.flag, group, played:0, won:0, draw:0, lost:0, gf:0, ga:0, gd:0, points:0};});
  });
  return map;
}
function getGroupStandingsFromMap(group, scoreMap){
  const table=groupTeams(group);
  matches.filter(m=>m.group===group).forEach(m=>{
    const r=scoreMap[String(m.id)];
    if(!r || r.home_goals==null || r.away_goals==null) return;
    const h=table[m.home.name], a=table[m.away.name];
    const hg=Number(r.home_goals), ag=Number(r.away_goals);
    if(Number.isNaN(hg) || Number.isNaN(ag)) return;
    h.played++; a.played++; h.gf+=hg; h.ga+=ag; a.gf+=ag; a.ga+=hg;
    if(hg>ag){h.won++; a.lost++; h.points+=3;}
    else if(hg<ag){a.won++; h.lost++; a.points+=3;}
    else{h.draw++; a.draw++; h.points++; a.points++;}
  });
  Object.values(table).forEach(t=>t.gd=t.gf-t.ga);
  return Object.values(table).sort((a,b)=>b.points-a.points||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name));
}
function getGroupStandings(group){

function knockoutScorePoints(pred, official){
  if(!pred || !official || pred.home_goals==null || pred.away_goals==null || official.home_goals==null || official.away_goals==null) return 0;
  const ph=Number(pred.home_goals), pa=Number(pred.away_goals), rh=Number(official.home_goals), ra=Number(official.away_goals);
  if([ph,pa,rh,ra].some(n=>Number.isNaN(n))) return 0;
  if(ph===rh && pa===ra) return 9;
  if(outcome(ph,pa)===outcome(rh,ra)) return 3;
  return 0;
}

function knockoutPointBreakdown(pid, matchId, roundKey=null){
  roundKey = roundKey || knockoutRoundKeyForMatch(matchId);
  const preds=predictionMap(pid);
  const res=resultMap();
  const predScore=preds[String(matchId)];
  const official=res[String(matchId)];
  const hasScore = hasOfficialResult(matchId);
  let score = hasScore ? knockoutScorePoints(predScore, official) : 0;

  const actual=officialTeamsForKnockoutMatch(matchId);
  const predicted=participantKnockoutTeams(pid)[String(matchId)] || {};
  const ph=predicted.home || '';
  const pa=predicted.away || '';
  const rule=knockoutRule(roundKey);

  let lands=0, combo=0;
  let landLabels=[];

  const actualHomeN=normName(actual.home);
  const actualAwayN=normName(actual.away);
  const phN=normName(ph);
  const paN=normName(pa);

  // Beheer is leidend:
  // - juiste plek = land staat officieel op exact dezelfde boven/thuis of onder/uit plek in deze wedstrijd.
  // - verkeerde plek = land staat officieel ergens anders in dezelfde ronde.
  if(phN){
    if(actualHomeN && phN===actualHomeN){
      lands += rule.plek;
      landLabels.push(`${ph} juiste plek ${rule.plek}`);
    }else if(participantPredictedCountryIsOfficialInRound(ph, roundKey)){
      lands += rule.land;
      landLabels.push(`${ph} door, verkeerde plek ${rule.land}`);
    }
  }
  if(paN && paN!==phN){
    if(actualAwayN && paN===actualAwayN){
      lands += rule.plek;
      landLabels.push(`${pa} juiste plek ${rule.plek}`);
    }else if(participantPredictedCountryIsOfficialInRound(pa, roundKey)){
      lands += rule.land;
      landLabels.push(`${pa} door, verkeerde plek ${rule.land}`);
    }
  }

  const homePlaceOk = phN && actualHomeN && phN===actualHomeN;
  const awayPlaceOk = paN && actualAwayN && paN===actualAwayN;
  if(hasScore && homePlaceOk && awayPlaceOk && predScore && official && Number(predScore.home_goals)===Number(official.home_goals) && Number(predScore.away_goals)===Number(official.away_goals)){
    combo = rule.combo;
  }

  let labels=[];
  if(landLabels.length) labels.push(...landLabels);
  else labels.push('Nog geen landpunten');

  if(score===9) labels.push('Exacte uitslag 9');
  else if(score===3) labels.push('Winnaar/gelijkspel goed 3');
  else if(!hasScore) labels.push('Uitslag nog niet bekend');
  else labels.push('Uitslag 0');

  if(combo) labels.push(`Alles exact extra ${combo}`);

  return {score, lands, combo, total:score+lands+combo, labels};
}
function poulePointBreakdown(pid, matchId){
  const pred=predictionMap(pid)[String(matchId)];
  const res=resultMap()[String(matchId)];
  const base=scorePrediction(pred,res);
  const joker=participantJokers(pid).includes(String(matchId));
  const total=joker ? base*2 : base;

  let parts=[];
  if(base===6) parts.push('Correcte uitslag 6 punten');
  else if(base===3) parts.push('Winnaar/gelijkspel goed 3 punten');
  else parts.push('0 punten');

  if(joker){
    if(base>0) parts.push(`Joker x2: ${base} → ${total} punten`);
    else parts.push('Joker ingezet, maar 0 x2 blijft 0');
  }

  return {base, joker, total, label:parts.join(' + ')};
}

  return `<div class="sticky-progress-inner"><span>${esc(label)}</span><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><span class="sticky-progress-count">${filled}/${total}</span></div>`;
}
function renderStickyProgress(tab=window.currentTab){

  if(!hasAccess() || !pid || pid==='admin' || !['predictions','finals','bonus'].includes(tab)){

  }

  const label = tab==='predictions' ? 'Poulewedstrijden' : tab==='finals' ? 'Finaleschema' : 'Bonus';
  el.innerHTML=stickyProgressHTML(label, data.filled, data.total);

function predictionProgress(pid){
  const pred=predictionMap(pid);
  const filled=matches.filter(m=>{
    const p=pred[String(m.id)];
    return p && p.home_goals!=null && p.away_goals!=null;
  }).length;
  return {filled,total:matches.length};
}
function knockoutMatchIds(){
  return [...knockoutFirstRound.map(f=>f.id), ...knockoutNextRounds.flatMap(r=>r.fixtures.map(f=>f.id))];
}
function finalsProgress(pid){
  const pred=predictionMap(pid);
  const picks=participantKnockoutTeams(pid);
  const ids=knockoutMatchIds();
  const filled=ids.filter(id=>{
    const p=pred[String(id)]||{};
    const k=picks[String(id)]||{};
    return !!k.home && !!k.away && p.home_goals!=null && p.away_goals!=null;
  }).length;
  return {filled,total:ids.length};
}
function bonusProgress(pid){
  const ans=participantBonusMap(pid);
  const filled=bonusQuestions.filter(q=>String(ans[q.id]||'').trim()!=='').length;
  return {filled,total:bonusQuestions.length};
}

function overviewPredictionCell(pred, res, pid, matchId){
  const filled=pred && pred.home_goals!==null && pred.away_goals!==null && pred.home_goals!==undefined && pred.away_goals!==undefined;
  if(!filled) return `<span class="pred-cell pending-cell">-<span class="pred-points">nog leeg</span></span>`;

  const scoreText=`${esc(pred.home_goals)}-${esc(pred.away_goals)}`;
  if(!res || res.home_goals===null || res.away_goals===null || res.home_goals===undefined || res.away_goals===undefined){
    return `<span class="pred-cell pending-cell">${scoreText}<span class="pred-points">nog geen uitslag</span></span>`;
  }

  const points=scorePrediction(pred,res) * (participantJokers(pid).includes(String(matchId)) ? 2 : 1);
  const basePoints=scorePrediction(pred,res);
  let cls='wrong-cell';
  let label='0 punten';
  if(basePoints===6){
    cls='exact-cell';
    label=`${points} punten`;
  }else if(basePoints===3){
    cls='outcome-cell';
    label=`${points} punten`;
  }

  return `<span class="pred-cell ${cls}">${scoreText}<span class="pred-points">${label}</span></span>`;
}

function renderOverview(){
  const el=document.getElementById("overviewBox");
  if(!el) return;
  if(!hasAccess()){
    el.innerHTML=`<div class="notice">🔒 Je ziet dit overzicht pas na goedkeuring.</div>`;
    return;
  }

  const participants=state.participants
    .filter(p=>p.status==="approved" && !participantIsDeleted(p))
    .sort((a,b)=>a.name.localeCompare(b.name));

  if(!participants.length){
    el.innerHTML=`<div class="notice">Nog geen goedgekeurde deelnemers.</div>`;
    return;
  }

  const resMap=resultMap();
  let html=`<div class="notice">Hier zie je alle voorspellingen van deelnemers. Groen = exact goed, oranje = winnaar/gelijkspel goed, rood = fout.</div>`;

  // Poulewedstrijden
  allGroups().forEach(group=>{
    html+=`<div class="group-title">${groupOrderName(group)}</div>`;
    html+=`<div style="overflow-x:auto"><table class="table"><thead><tr><th>Wedstrijd</th><th>Officieel</th>${participants.map(p=>`<th>${esc(p.name)}</th>`).join("")}</tr></thead><tbody>`;
    matches.filter(m=>m.group===group).forEach(m=>{
      const official=resMap[String(m.id)];
      const officialFilled=official && official.home_goals!==null && official.away_goals!==null && official.home_goals!==undefined && official.away_goals!==undefined;
      html+=`<tr>
        <td>${teamHTML(m.home)} <span class="small">vs</span> ${teamHTML(m.away)}</td>
        <td><strong>${officialFilled ? `${esc(official.home_goals)}-${esc(official.away_goals)}` : "-"}</strong></td>
        ${participants.map(p=>{
          const pred=predictionMap(p.id)[String(m.id)];
          return `<td>${overviewPredictionCell(pred, official, p.id, m.id)}</td>`;
        }).join("")}
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  });

  // Finaleschema
  const finalIds = knockoutMatchIds();
  if(finalIds && finalIds.length){
    html+=`<div class="group-title">🏆 Finaleschema</div>`;
    html+=`<div style="overflow-x:auto"><table class="table"><thead><tr><th>Wedstrijd</th><th>Officieel</th>${participants.map(p=>`<th>${esc(p.name)}</th>`).join("")}</tr></thead><tbody>`;

    finalIds.forEach(id=>{
      const official=resMap[String(id)];
      const officialFilled=official && official.home_goals!==null && official.away_goals!==null && official.home_goals!==undefined && official.away_goals!==undefined;
      html+=`<tr>
        <td>Wedstrijd ${id}</td>
        <td><strong>${officialFilled ? `${esc(official.home_goals)}-${esc(official.away_goals)}` : "-"}</strong></td>
        ${participants.map(p=>{
          const pred=predictionMap(p.id)[String(id)];
          const picks = participantKnockoutTeams(p.id)[String(id)] || {};
          const teams = [picks.home, picks.away].filter(Boolean).join(' vs ');
          return `<td>
            ${overviewPredictionCell(pred, official, p.id, id)}
            ${teams ? `<div class="small" style="margin-top:4px">${esc(teams)}</div>` : ``}
          </td>`;
        }).join("")}
      </tr>`;
    });

    html+=`</tbody></table></div>`;
  }

  // Bonusvragen
  html+=`<div class="group-title">⭐ Bonusvragen</div>`;
  html+=`<div style="overflow-x:auto"><table class="table"><thead><tr><th>Vraag</th>${participants.map(p=>`<th>${esc(p.name)}</th>`).join("")}</tr></thead><tbody>`;

  bonusQuestions.forEach(q=>{
    html+=`<tr>
      <td>${esc(q.question)}</td>
      ${participants.map(p=>{
        const answer = participantBonusMap(p.id)[q.id] || '-';
        return `<td>${esc(answer)}</td>`;
      }).join("")}
    </tr>`;
  });

  html+=`</tbody></table></div>`;

  el.innerHTML=html;
}

function renderFinals(){
  if(!hasAccess()){document.getElementById("finalsBox").innerHTML=`<div class="notice">🔒 Je ziet het finaleschema pas na goedkeuring en betaling.</div>`;return;}
  const teams=getKnockoutTeams();
  // Finaleschema is altijd de gok/voorspelling van de deelnemer.
  // Officiële finales vul je alleen in via Beheer, zodat dit nooit door elkaar loopt.
  const mode = 'participant';
  const predMap = state.currentParticipant && state.currentParticipant.id!=='admin' ? predictionMap(state.currentParticipant.id) : {};

async function saveKnockoutResult(id,btn){
  // Belangrijk: dezelfde finales worden zowel in tab "Finaleschema" als in "Beheer" gerenderd.
  // Daarom lezen we de waarden uit het wedstrijdblok van de knop zelf en niet via document.getElementById().
  // Zo springt de beheer-invoer niet meer terug naar een verborgen dubbele invoer.
  const box = btn.closest('.bracket-match') || document;
  const h = box.querySelector(`#ko-h-${id}`)?.value ?? "";
  const a = box.querySelector(`#ko-a-${id}`)?.value ?? "";
  const homeTeam = box.querySelector(`#ko-home-${id}`)?.value || '';
  const awayTeam = box.querySelector(`#ko-away-${id}`)?.value || '';

  if((homeTeam && awayTeam) && homeTeam===awayTeam) return alert('Je kunt hetzelfde land niet tegen zichzelf laten spelen.');

  const row={match_id:String(id),home_goals:h===""?null:parseInt(h,10),away_goals:a===""?null:parseInt(a,10)};
  const {error}=await db.from("official_results").upsert(row,{onConflict:"match_id"});
  if(error)return alert(error.message);

  const bonusRows=[
    {question_id:`official_ko_${id}_home`,answer:homeTeam},
    {question_id:`official_ko_${id}_away`,answer:awayTeam}
  ];
  const b=await db.from("official_bonus_answers").upsert(bonusRows,{onConflict:"question_id"});
  if(b.error)return alert(b.error.message);

  const i=state.results.findIndex(r=>String(r.match_id)===String(id));
  if(i>=0) state.results[i]={...state.results[i],...row}; else state.results.push(row);
  bonusRows.forEach(br=>{
    const j=state.officialBonus.findIndex(x=>x.question_id===br.question_id);
    if(j>=0) state.officialBonus[j]={...state.officialBonus[j],...br}; else state.officialBonus.push(br);
  });

  // Laad alles opnieuw uit Supabase zodat de stand altijd met de nieuwste officiële landen/uitslagen rekent.
  await loadAll();
  showTab('admin');
  showToast("✅ Juiste uitslag opgeslagen — stand bijgewerkt");
}

function jokerInputs(){return [...document.querySelectorAll('.joker-hidden')];}
function refreshJokerButtons(){
  const inputs=jokerInputs();
  const used=inputs.filter(x=>x.checked).length;
  const remaining=Math.max(0,3-used);
  inputs.forEach(input=>{
    const id=input.id.replace('joker-','');
    const btn=document.getElementById(`joker-btn-${id}`);
    if(!btn) return;
    btn.classList.toggle('active', input.checked);
    btn.disabled = !input.checked && remaining<=0;
    btn.innerHTML = input.checked ? '⚡ Joker actief' : `⚡ Joker <span class="joker-count">(${remaining})</span>`;
  });
}
function toggleJoker(matchId){
  const input=document.getElementById(`joker-${matchId}`);
  if(!input) return;
  const used=jokerInputs().filter(x=>x.checked).length;
  if(!input.checked && used>=3){
    showToast('⚡ Je hebt al 3 jokers ingezet');
    return;
  }
  input.checked=!input.checked;
  refreshJokerButtons();
  showToast(input.checked ? '🃏 Joker ingezet! Dubbele punten' : '⚡ Joker verwijderd');
}
function limitJokers(changed){

async function savePredictionGroup(group,btn){
  const pid=state.currentParticipant?.id; if(!pid||pid==="admin")return alert("Kies eerst je naam.");
  const rows=matches.filter(m=>m.group===group).map(m=>{
    const h=document.getElementById(`pred-h-${m.id}`).value;
    const a=document.getElementById(`pred-a-${m.id}`).value;
    const hasHome=h!=="" && !Number.isNaN(Number(h));
    const hasAway=a!=="" && !Number.isNaN(Number(a));
    if(!hasHome && !hasAway) return null; // oude lege records niet opnieuw opslaan
    if(hasHome !== hasAway) return {error:true, match:m};
    return {participant_id:pid,match_id:String(m.id),home_goals:parseInt(h,10),away_goals:parseInt(a,10)};
  });
  const invalid=rows.find(r=>r && r.error);
  if(invalid) return alert(`Vul bij ${invalid.match.home.name} - ${invalid.match.away.name} beide scores in, of laat beide velden leeg.`);
  const rowsToSave=rows.filter(Boolean);
  if(!rowsToSave.length) return alert("Vul minimaal één complete uitslag in voordat je opslaat.");

  // v47: niet alleen lokaal bewaren, maar controleren of Supabase de opgeslagen voorspellingen ook echt teruggeeft.
  // Als dit faalt, ziet de deelnemer op dezelfde telefoon soms wel 72/72 door localStorage,
  // maar ziet de beheerder/de totaalpagina de voorspellingen niet.
  let data=[];
  try{
    data=await replaceParticipantRowsInSupabase("predictions", pid, "match_id", rowsToSave);
  }catch(e){
    return alert("Voorspellingen niet opgeslagen in Supabase: " + e.message);
  }

  const allJokerInputs=[...document.querySelectorAll('[id^="joker-"]')];
  const checkedAll=allJokerInputs.filter(x=>x.checked);
  if(checkedAll.length>3){ showToast('⚡ Je mag maximaal 3 jokers inzetten'); return; }
  const jokerRows=matches.map(m=>({participant_id:pid,question_id:`joker_${m.id}`,answer:document.getElementById(`joker-${m.id}`)?.checked?'true':'false'}));
  let jokerData=[];
  try{
    jokerData=await replaceParticipantRowsInSupabase("bonus_answers", pid, "question_id", jokerRows);
  }catch(e){
    return alert("Jokers niet opgeslagen in Supabase: " + e.message);
  }

  clearOldLocalParticipantCache(pid);
  state.predictions=replaceRowsByKey(state.predictions, data, p=>`${p.participant_id}_${p.match_id}`);
  state.bonus=replaceRowsByKey(state.bonus, jokerData, x=>`${x.participant_id}_${x.question_id}`);

  // Belangrijk: niet de invulpagina opnieuw tekenen na opslaan.
  // Daardoor blijven de zojuist ingevulde velden zichtbaar op telefoon/desktop.
  // We werken wel direct de state, stand, voortgang en totaaloverzicht bij met Supabase-data.
  renderStandings();
  renderOverview();
  renderStickyProgress("predictions");
  if(window.currentTab==='finals') renderFinals();

  const newBtn=[...document.querySelectorAll('#predictionBox button.save')].find(b=>b.getAttribute('onclick')===`savePredictionGroup('${group}', this)`) || btn;
  markSaved(newBtn,"Opgeslagen");
  showToast("✅ Opgeslagen");
}

function collectBonusRows(pid, onlyQid=null){
  const questions = onlyQid ? bonusQuestions.filter(q=>q.id===onlyQid) : bonusQuestions;

    const input=document.getElementById(`bonus-${q.id}`);

  }).filter(Boolean);

function updateLocalBonusState(pid, rows){
  clearOldLocalParticipantCache(pid);
  state.bonus=replaceRowsByKey(state.bonus, rows, x=>`${x.participant_id}_${x.question_id}`);
}
async function saveBonus(qid,btn){
  const pid=state.currentParticipant?.id;
  if(!pid||pid==="admin") return alert("Log eerst in als deelnemer.");
  const rows=collectBonusRows(pid, qid);
  if(!rows.length) return alert("Vul eerst een antwoord in voordat je opslaat.");

  let data=[];
  try{
    data=await replaceParticipantRowsInSupabase("bonus_answers", pid, "question_id", rows);
  }catch(e){
    return alert("Bonusvraag niet opgeslagen in Supabase: " + e.message);
  }

  updateLocalBonusState(pid, data);

  renderStickyProgress("bonus");
  renderStandings();
  renderOverview();
  markSaved(btn,"Opgeslagen");
  showToast("✅ Opgeslagen");
}
async function saveAllBonus(btn){
  const pid=state.currentParticipant?.id;
  if(!pid||pid==="admin") return alert("Log eerst in als deelnemer.");
  const rows=collectBonusRows(pid);
  if(!rows.length) return alert("Vul minimaal één bonusvraag in voordat je opslaat.");

  let data=[];
  try{
    data=await replaceParticipantRowsInSupabase("bonus_answers", pid, "question_id", rows);
  }catch(e){
    return alert("Bonusvragen niet opgeslagen in Supabase: " + e.message);
  }

  updateLocalBonusState(pid, data);

  renderBonus();
  renderStickyProgress("bonus");
  renderStandings();
  renderOverview();
  const newBtn=document.querySelector('#bonusBox .group-actions button.save') || btn;
  markSaved(newBtn,"Opgeslagen");
  showToast("✅ Opgeslagen");
}
function renderChat(){
  if(!hasAccess()){document.getElementById("chatBox").innerHTML=`<div class="notice">🔒 Je kunt berichten pas lezen en plaatsen na goedkeuring en betaling.</div>`;return;}
  const cur=state.currentParticipant;
  document.getElementById("chatBox").innerHTML = `${cur&&cur.id!=="admin"?`<div class="notice">Je plaatst berichten als <strong>${esc(cur.name)}</strong>.</div><textarea id="msgText" placeholder="Schrijf een bericht..."></textarea><button class="save" onclick="sendMessage(this)">Plaats bericht</button>`:`<div class="notice">Log in als deelnemer om berichten te plaatsen.</div>`}
  <h3>Berichten</h3>${state.messages.map(m=>`<div class="msg"><strong>${esc(m.name)}</strong><time>${new Date(m.created_at).toLocaleString("nl-NL")}</time><p>${esc(m.message)}</p></div>`).join("") || "<p>Nog geen berichten.</p>"}`;
}
async function sendMessage(btn){const cur=state.currentParticipant;const message=document.getElementById("msgText").value.trim();if(!cur||cur.id==="admin"||!message)return; const {error}=await db.from("messages").insert({participant_id:cur.id,name:cur.name,message}); if(error)return alert(error.message); markSaved(btn,"Geplaatst"); showToast("✅ Bericht geplaatst"); await loadAll();}
function renderAdmin(){
  document.getElementById("adminLogin").innerHTML = state.adminUnlocked ? "" : `<label>Beheercode</label><input id="adminCode" type="password" placeholder="Beheercode"><button class="save" onclick="unlockAdmin(this)">Open beheer</button>`;
  if(!state.adminUnlocked) return;
  const settings=`<div class="card"><h3>Instellingen</h3><label>Inschrijven</label><select onchange="saveSetting('registration_open', this.value==='true')"><option value="true" ${state.settings.registration_open?"selected":""}>Open</option><option value="false" ${!state.settings.registration_open?"selected":""}>Dicht</option></select><label>Voorspellingen invullen</label><select onchange="saveSetting('predictions_open', this.value==='true')"><option value="true" ${state.settings.predictions_open?"selected":""}>Open</option><option value="false" ${!state.settings.predictions_open?"selected":""}>Dicht</option></select></div>`;
  const participants=`<div class="card"><h3>Deelnemers beheren</h3><p class="small">Hier kun je namen en wachtwoorden aanpassen als iemand iets gewijzigd wil hebben.</p><table class="table"><thead><tr><th>Naam</th><th>Email</th><th>Wachtwoord</th><th>Status</th><th>Betaald</th><th>Actie</th><th>Verwijderen</th></tr></thead><tbody>${state.participants.filter(p=>!participantIsDeleted(p)).map(p=>`<tr><td><input id="name-${p.id}" value="${esc(p.name||"")}" style="min-width:130px"><button class="save secondary" onclick="setParticipantName('${p.id}', this)">Naam opslaan</button></td><td>${esc(p.email)}</td><td><input id="pw-${p.id}" value="${esc(p.password||"")}" style="min-width:110px"><button class="save secondary" onclick="setPassword('${p.id}')">Opslaan</button></td><td><span class="status-pill ${p.status}">${p.status}</span></td><td><input type="checkbox" ${p.paid?"checked":""} onchange="setPaid('${p.id}', this.checked)"></td><td><button class="save" onclick="setStatus('${p.id}','approved')">Goedkeuren</button> <button class="save danger" onclick="setStatus('${p.id}','rejected')">Afkeuren</button></td><td><button class="save danger" onclick="deleteParticipant('${p.id}')">Verwijder</button></td></tr>`).join("") || `<tr><td colspan="7">Nog geen deelnemers.</td></tr>`}</tbody></table></div>`;
  const results=`<div class="card"><h3>Officiële uitslagen / nakijken</h3><p class="small">Vul hier de juiste uitslagen in. Punten worden pas vrijgegeven zodra de hele poule of vorige knock-outronde compleet is. Winnaar goed = 3 punten, exacte score = 6 punten.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="save danger" onclick="resetOfficialResults(this)">Alles resetten naar 0-0</button><button class="save secondary" onclick="saveEmptyOfficialState(this)">Reset opslaan</button></div>${renderOfficialResults()}<div class="group-title">Finales invullen bij beheer</div>${renderAdminFinalsResults()}</div>`;
  const bonus=`<div class="card"><h3>Juiste bonusantwoorden</h3>${renderOfficialBonus()}</div>`;
  document.getElementById("adminPanel").classList.remove("hidden");
  document.getElementById("adminPanel").innerHTML=settings+participants+results+bonus;
}
function unlockAdmin(btn){if(document.getElementById("adminCode").value!==ADMIN_CODE)return alert("Onjuiste beheercode"); state.adminUnlocked=true; localStorage.setItem("wk_admin_unlocked","true"); btn.classList.add("saved"); renderAll(); showTab("admin");}
async function saveSetting(key,value){await db.from("app_settings").upsert({key,value},{onConflict:"key"}); await loadAll(); showTab("admin");}
async function setParticipantName(id,btn){
  const name=document.getElementById(`name-${id}`)?.value.trim();
  if(!name) return alert('Vul een naam in.');
  const {error}=await db.from("participants").update({name}).eq("id",id);
  if(error) return alert(error.message);
  const p=state.participants.find(x=>x.id===id);
  if(p) p.name=name;
  if(state.currentParticipant && state.currentParticipant.id===id){
    state.currentParticipant={...state.currentParticipant,name};
    localStorage.setItem("wk_current_participant", JSON.stringify(state.currentParticipant));
  }
  markSaved(btn,'Naam opgeslagen');
  showToast('✅ Naam opgeslagen');
  await loadAll();
  showTab("admin");
}
async function setPaid(id,paid){await db.from("participants").update({paid}).eq("id",id); await loadAll(); showTab("admin");}
async function setStatus(id,status){await db.from("participants").update({status}).eq("id",id); await loadAll(); showTab("admin");}
async function deleteParticipant(id){
  const p=state.participants.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`Weet je zeker dat je ${p.name} helemaal wilt verwijderen? Alles van dit account verdwijnt: voorspellingen, finaleschema, bonusantwoorden, berichten en het account zelf.`)) return;

  // Direct lokaal uit beeld halen, zodat beheer en deelnemers hem meteen niet meer zien.
  const deletedIds = JSON.parse(localStorage.getItem('wk_deleted_participants') || '[]');
  if(!deletedIds.includes(id)){
    deletedIds.push(id);
    localStorage.setItem('wk_deleted_participants', JSON.stringify(deletedIds));
  }

  state.settings.deleted_participants = [...new Set([...(state.settings.deleted_participants||[]), id])];
  state.participants = state.participants.filter(x=>x.id!==id);
  state.predictions = state.predictions.filter(x=>x.participant_id!==id);
  state.bonus = state.bonus.filter(x=>x.participant_id!==id);
  state.messages = state.messages.filter(x=>x.participant_id!==id);

  if(state.currentParticipant && state.currentParticipant.id===id){
    state.currentParticipant=null;
    localStorage.removeItem("wk_current_participant");
  }

  renderAll();
  showTab("admin");

  // Eerst gekoppelde data verwijderen, daarna pas het account zelf.
  // Zo blijft er niets zichtbaar in stand, chat, voorspellingen, bonus of beheer.
  const errors=[];

  try{
    const allDeleted = [...new Set([...deletedParticipantsAll(), id])];
    const saved = await saveDeletedParticipantsGlobal(allDeleted);
    if(saved?.error) errors.push(saved.error.message || 'Globale verwijderlijst kon niet worden opgeslagen.');
  }catch(e){
    errors.push(e.message || String(e));
  }

  for(const action of [
    () => db.from("predictions").delete().eq("participant_id",id),
    () => db.from("bonus_answers").delete().eq("participant_id",id),
    () => db.from("messages").delete().eq("participant_id",id),
    () => db.from("participants").delete().eq("id",id)
  ]){
    try{
      const res = await action();
      if(res?.error) errors.push(res.error.message);
    }catch(e){
      errors.push(e.message || String(e));
    }
  }

  await loadAll();
  showTab("admin");

  if(errors.length){
    alert(`${p.name} is lokaal uit beeld gehaald. Supabase gaf nog een melding bij definitief verwijderen: ${[...new Set(errors)].join(' | ')}`);
  }else{
    alert(`${p.name} is helemaal verwijderd.`);
  }
}
async function setPassword(id){
  const password=document.getElementById(`pw-${id}`).value.trim();
  if(password.length < 4) return alert("Wachtwoord moet minimaal 4 tekens zijn.");
  await db.from("participants").update({password}).eq("id",id);
  await loadAll();
  showTab("admin");
}
function allOfficialMatchIds(){
  return [...matches.map(m=>String(m.id)), ...knockoutFirstRound.map(f=>String(f.id)), ...knockoutNextRounds.flatMap(r=>r.fixtures.map(f=>String(f.id)))];
}
async function resetOfficialResults(btn){
  if(!confirm('Weet je zeker dat je alles wilt resetten? Officiële poule-uitslagen, finales en bonusantwoorden worden leeggemaakt.')) return;
  await clearOfficialStateInDatabase();
  markSaved(btn, 'Gereset');
  showToast('✅ Alles staat klaar op 0-0');
  renderAll();
  showTab('admin');
}
async function saveEmptyOfficialState(btn){
  await clearOfficialStateInDatabase();
  markSaved(btn, 'Reset opgeslagen');
  showToast('✅ Reset opgeslagen');
  renderAll();
  showTab('admin');
}
async function clearOfficialStateInDatabase(){
  const ids=allOfficialMatchIds();
  // Sla lege officiële uitslagen expliciet op. Daardoor komen oude scores niet terug na wisselen van tabblad of herladen.
  const emptyRows=ids.map(id=>({match_id:String(id),home_goals:null,away_goals:null}));
  const up=await db.from('official_results').upsert(emptyRows,{onConflict:'match_id'});
  if(up.error) return alert(up.error.message);

  const officialKoQuestionIds=ids.flatMap(id=>[`official_ko_${id}_home`,`official_ko_${id}_away`]);
  const regularBonusIds=bonusQuestions.map(q=>q.id);
  await db.from('official_bonus_answers').delete().in('question_id',[...officialKoQuestionIds,...regularBonusIds]);

  state.results=emptyRows;
  state.officialBonus=state.officialBonus.filter(x=>![...officialKoQuestionIds,...regularBonusIds].includes(x.question_id));
}
function renderAdminFinalsResults(){
  const teams=getKnockoutTeams();
  let html='<div class="notice">Vul hier de officiële finalewedstrijden in. Per wedstrijd kies je de officiële landen; die landpunten tellen direct. De uitslagpunten komen erbij zodra je de echte uitslag invult.<br><br><strong>Puntencontrole knock-out:</strong> Knock-out uitslag exact = 9 punten, winnaar/gelijkspel = 3 punten. Laatste 32/Achtste: land verkeerde plek 2, juiste plek 4, alles exact extra 9. Kwart: 4/6/13. Halve: 6/8/17. Finale: 10/10/25.</div>';
  html+=renderFinalRound('Laatste 32', knockoutFirstRound, teams, 'admin', {});
  knockoutNextRounds.forEach(round=>{ html+=renderFinalRound(round.name, round.fixtures, teams, 'admin', {}); });
  return html;
}
function renderOfficialResults(){
  const res=resultMap(); let html="";
  allGroups().forEach(group=>{
    html+=`<div class="group-title">${groupOrderName(group)}</div>${renderGroupStandings(group)}`;
    matches.filter(m=>m.group===group).forEach(m=>{
      const r=res[String(m.id)]||{};
      html+=`<div class="match"><div class="small">${m.date} • ${m.time}</div><div class="teams">${teamHTML(m.home)}<span>vs</span>${teamHTML(m.away)}</div><div class="score"><input id="res-h-${m.id}" type="number" min="0" value="${r.home_goals??''}"><span>-</span><input id="res-a-${m.id}" type="number" min="0" value="${r.away_goals??''}"></div></div>`;
    });
    html+=`<button class="save" onclick="saveOfficialGroup('${group}', this)">Uitslagen ${groupOrderName(group)} opslaan</button>`;
  });
  return html;
}
async function saveOfficialGroup(group,btn){
  const rows=matches.filter(m=>m.group===group).map(m=>{
    const h=document.getElementById(`res-h-${m.id}`).value;
    const a=document.getElementById(`res-a-${m.id}`).value;
    return {match_id:String(m.id),home_goals:h===""?null:parseInt(h,10),away_goals:a===""?null:parseInt(a,10)};
  });
  const {error}=await db.from("official_results").upsert(rows,{onConflict:"match_id"});
  if(error)return alert(error.message);
  rows.forEach(row=>{
    const i=state.results.findIndex(r=>String(r.match_id)===String(row.match_id));
    if(i>=0) state.results[i]={...state.results[i],...row}; else state.results.push(row);
  });
  renderStandings();
  renderPredictions();
  renderOverview();
  renderFinals();
  renderAdmin();
  renderStickyProgress(window.currentTab || "admin");
  const newBtn=[...document.querySelectorAll('#adminPanel button.save')].find(b=>b.textContent.includes(`Uitslagen ${groupOrderName(group)} opslaan`)) || btn;
  markSaved(newBtn,"Opgeslagen");
  showToast("✅ Opgeslagen");
}
function renderOfficialBonus(){const off=officialBonusMap(); return bonusQuestions.map(q=>{const v=off[q.id]||""; const field=q.type==="text"?`<input id="off-bonus-${q.id}" value="${esc(v)}">`:`<select id="off-bonus-${q.id}">${q.options?optionList(q.options,v):countryOptions(v)}</select>`;return `<div class="match"><strong>${q.question}</strong>${field}</div>`;}).join("")+`<button class="save" onclick="saveOfficialBonus(this)">Bonusantwoorden opslaan</button>`;}
async function saveOfficialBonus(btn){const rows=bonusQuestions.map(q=>({question_id:q.id,answer:document.getElementById(`off-bonus-${q.id}`).value})); const {error}=await db.from("official_bonus_answers").upsert(rows,{onConflict:"question_id"}); if(error)return alert(error.message); markSaved(btn,"Opgeslagen"); showToast("✅ Opgeslagen"); await loadAll(); showTab("admin");}

function logout(){localStorage.removeItem("wk_current_participant");localStorage.removeItem("wk_admin_unlocked");state.currentParticipant=null;state.adminUnlocked=false;renderAll();showTab("signup");}
function renderAll(){updateNavigation();renderAccessBox();renderStandings();renderSignup();renderPredictions();renderOverview();renderFinals();renderBonus();renderChat();renderAdmin();renderRules();renderStickyProgress(window.currentTab);}
loadAll();
